# dsh-purge bundle patch
#
# 清洗 + 演练台都在本插件内。
# 只装 dsh-purge，不外接、不 link 其它包。

# 关掉旧的独立红队包行（若用户以前装过 dsh-redteam-mode）
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    # 不要在这里写裸 `{{cwd}}`。agent-loop 只注册 provider / model，
    # 未注册变量会让宿主在渲染时抛
    #   unknown prompt variable "{{cwd}}" in section "deployment:persona-suffix"
    # 而且这条 section 每轮都参与渲染，所以装完插件还没点「应用」就会炸。
    personaSuffix: ""

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: standard

- id: dsh-purge
  inject: [systemPrompt, tools]

- insert:
    - id: dsh-purge
      name: 'dsh-purge'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        autoApplyOnStart: false
        injectOnce: false
        verbose: false

    # 演练台：预设 + 技能落地
    - id: dsh-purge-redteam
      name: dsh-purge/redteam

    # 演练台事实库，数据在 $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥
    - id: dsh-purge-redteam-ui
      name: dsh-purge/redteam/ui
